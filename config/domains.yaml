# Recording conditions. Each value is a range [low, high] drawn once per episode (camera, lighting)
# or a rate per frame/second (occlusion, frame drops, noise). `train` is what the labelled data was
# recorded under; the others are shifts the models are tested on.
train:
  rotation_deg: [-4, 4]
  scale: [0.95, 1.05]
  shift: [-2, 2]
  tilt: [0.0, 0.03]
  gain: [0.9, 1.1]
  tint: [0.95, 1.05]
  vignette: [0.0, 0.1]
  noise: [0.01, 0.02]
  occlusions_per_minute: [0, 0]
  frame_drop: [0, 0]
camera:   # a camera mounted at another angle and height
  rotation_deg: [-25, 25]
  scale: [0.8, 1.2]
  shift: [-6, 6]
  tilt: [0.05, 0.15]
  gain: [0.9, 1.1]
  tint: [0.95, 1.05]
  vignette: [0.0, 0.1]
  noise: [0.01, 0.02]
  occlusions_per_minute: [0, 0]
  frame_drop: [0, 0]
lighting: # night shift, cold LEDs, a lamp at one side
  rotation_deg: [-4, 4]
  scale: [0.95, 1.05]
  shift: [-2, 2]
  tilt: [0.0, 0.03]
  gain: [0.55, 1.4]
  tint: [0.75, 1.25]
  vignette: [0.2, 0.45]
  noise: [0.03, 0.06]
  occlusions_per_minute: [0, 0]
  frame_drop: [0, 0]
busy:     # colleagues walking through the view, a camera that drops frames
  rotation_deg: [-4, 4]
  scale: [0.95, 1.05]
  shift: [-2, 2]
  tilt: [0.0, 0.03]
  gain: [0.9, 1.1]
  tint: [0.95, 1.05]
  vignette: [0.0, 0.1]
  noise: [0.01, 0.02]
  occlusions_per_minute: [2, 5]
  frame_drop: [0.03, 0.10]
