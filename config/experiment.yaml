# What `scv run` builds and trains. `full` produces the committed reports; `quick` is the CI smoke run.
seconds: 120             # length of each recording
profiles:
  full:
    train_episodes: 8    # per training station, train domain
    val_episodes: 1      # per training station (temperature, thresholds)
    test_episodes: 2     # per station and domain
    onboarding_episodes: 3   # new station S5: test recordings
    heldout_episodes: 4
    encoder_epochs: 6
    detector_epochs: 6
    temporal_epochs: 60
  quick:
    train_episodes: 1
    val_episodes: 1
    test_episodes: 1
    onboarding_episodes: 1
    heldout_episodes: 1
    encoder_epochs: 1
    detector_epochs: 1
    temporal_epochs: 3
    seconds: 40

train_stations: [S1, S2, S3, S4]
onboarding_station: S5
test_domains: [train, camera, lighting, busy]

encoder:
  batch: 128
  lr: 0.002
  weight_decay: 0.0001
  # geometric and photometric augmentation for the "augmented" encoder
  augment: {rotation_deg: 25, scale: [0.8, 1.2], shift: 6, gain: [0.6, 1.4], tint: 0.2, noise: 0.05}
temporal:
  hidden: 64
  layers: 8              # causal TCN: dilations 1..128 -> receptive field 511 frames (102 s)
  stages: 2
  lr: 0.002
  smooth_weight: 0.15    # MS-TCN truncated-MSE smoothing loss
  transformer_layers: 2
  transformer_heads: 4
detector:
  batch: 64
  lr: 0.002
  stride: 4
  threshold_grid: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3]   # peak threshold chosen on validation recordings
  frame_stride: 2         # train on every 2nd frame (neighbouring frames are near duplicates)
  match_px: 3.0
tracker:
  max_missed: 10
  gate_px: 8.0
process:
  min_segment_s: 0.4     # shorter predicted segments are merged into their neighbours
