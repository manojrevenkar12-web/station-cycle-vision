# Training and evaluation as a Kubernetes Job on the training cluster (not on camera boxes).
# Runs `scv all`; MLflow, models and reports land on the run volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: scv-train
  namespace: scv
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: train
          image: scv-train
          args: ["scv", "all", "--profile", "full"]
          resources:
            requests: { cpu: "4", memory: 6Gi }
            limits: { memory: 8Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: runs, mountPath: /app/runs }
      volumes:
        - name: runs
          persistentVolumeClaim: { claimName: scv-runs }
