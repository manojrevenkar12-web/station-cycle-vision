apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - { name: scv-edge, newName: scv-edge, newTag: ci }
patches:
  - target: { kind: Deployment, name: scv-edge }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
