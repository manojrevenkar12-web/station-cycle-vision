name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  python:
    name: python (lint, tests, release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,service,dev]" sqlalchemy alembic
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Tests (simulator, process, metrics, streaming, ONNX parity, service, DDP, protocol)
        run: pytest -m "not slow"
      - name: Release gate on the committed full run
        run: scv gate

  pipeline:
    name: pipeline end to end (quick profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,service,dev]" sqlalchemy alembic
      - run: pytest -m slow
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quick-run, path: 'runs/quick/*.json' }

  edge-image:
    name: edge image on kind (no PyTorch in the image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the edge image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.edge, tags: 'scv-edge:ci', load: true, cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - name: The edge image has no PyTorch and stays small
        run: |
          docker run --rm scv-edge:ci python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('torch') else 0)"
          docker image inspect scv-edge:ci --format '{{.Size}}' | awk '{ s=$1/1024/1024; print s " MB"; exit (s > 900) }'
      - name: Build the training image
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.train, tags: 'scv-train:ci', load: false, cache-from: type=gha }
      - uses: helm/kind-action@v1
        with: { cluster_name: scv }
      - name: Deploy
        run: |
          kind load docker-image scv-edge:ci --name scv
          kubectl apply -k deploy/k8s/overlays/kind
          kubectl -n scv rollout status deployment/scv-edge --timeout=240s
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - name: Stream a recording to the cluster
        run: |
          pip install -e .
          kubectl -n scv port-forward svc/scv-edge 8080:80 > pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          python scripts/smoke.py http://localhost:8080
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n scv get all
          kubectl -n scv describe pods | tail -60
          kubectl -n scv logs deployment/scv-edge --tail=80 || true

  web:
    name: dashboard (lint, types, unit, build, browser + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
